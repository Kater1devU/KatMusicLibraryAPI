name: Music Library API - CI

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore ./KatMusicLibraryAPI.slnx

      - name: Build project
        run: dotnet build ./KatMusicLibraryAPI.slnx --configuration Release --no-restore

      - name: Run Unit Tests
        run: dotnet test ./KatMusicLibraryAPI.Tests/KatMusicLibraryAPI.Tests.csproj --configuration Release --no-build --no-restore
